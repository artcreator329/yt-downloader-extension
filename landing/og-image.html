<!DOCTYPE html>
<!--
  Source for the Open Graph / social preview image (landing/og.png, 1200x630).
  The popup on the right is the real one: og-popup.html (generated from popup/popup.html).
  Re-render after editing:
    "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" --headless=new \
      --user-data-dir="$(mktemp -d)" --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=6000 \
      --screenshot="$PWD/landing/og.png" "file://$PWD/landing/og-image.html"
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YT Downloader social image</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    color: #f1f5f9;
    background:
      radial-gradient(ellipse 60% 70% at 12% 0%, rgba(255, 0, 51, 0.30), transparent 70%),
      radial-gradient(circle at 92% 90%, rgba(96, 165, 250, 0.12), transparent 45%),
      #07090f;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  body::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 80% 80% at 30% 20%, #000 20%, transparent 75%);
  }
  .wrap { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 362px; gap: 52px; height: 100%; padding: 64px 70px 56px; }
  .left { display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 26px; letter-spacing: -0.01em; }
  .brand img { width: 52px; height: 52px; border-radius: 14px; box-shadow: 0 10px 30px rgba(255, 0, 51, 0.45); }
  h1 { margin-top: 48px; font-size: 57px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em; }
  h1 .grad { background: linear-gradient(135deg, #ff4d6d, #ff0033 60%, #d4002b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 24px; color: #94a3b8; font-weight: 500; }
  .chips { margin-top: auto; display: flex; gap: 10px; }
  .chip { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #e2e8f0; }
  .chip.hot { background: rgba(255, 0, 51, 0.14); border-color: rgba(255, 0, 51, 0.45); color: #ff6b85; }
  .url { margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #64748b; font-weight: 700; }

  .right { display: flex; align-items: flex-start; justify-content: center; }
  /* The real extension popup (og-popup.html + popup/popup.css), cropped and faded at the bottom */
  .popup { width: 360px; height: 500px; border: 1px solid rgba(255,255,255,0.16); border-radius: 16px; background: #0f0f0f;
           box-shadow: 0 30px 70px rgba(0,0,0,0.55), 0 0 0 6px rgba(255,255,255,0.03);
           -webkit-mask-image: linear-gradient(#000 90%, transparent); mask-image: linear-gradient(#000 90%, transparent); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="brand"><img src="../icons/icon128.png" alt="">YT Downloader</div>
      <h1>Save any YouTube video<br>in <span class="grad">4K, 1080p or MP3</span></h1>
      <p class="sub">Open it on any YouTube video, pick a quality,<br>and it lands in your Downloads. Free, no ads.</p>
      <div class="chips"><span class="chip hot">4K</span><span class="chip">1080p</span><span class="chip">720p</span><span class="chip">MP3</span><span class="chip">Thumbnail</span></div>
      <div class="url">yt.aigility.digital</div>
    </div>
    <div class="right">
      <iframe class="popup" src="og-popup.html" title=""></iframe>
    </div>
  </div>
</body>
</html>
